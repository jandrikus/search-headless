name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Test prebuilt installer
        run: bash tests/install.sh
      - name: Install pinned Obscura and build
        run: bash install.sh
      - name: Test with the installed browser
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/search-headless dist/search-headless
          tar -C dist -czf "search-headless-${{ matrix.target }}.tar.gz" search-headless
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: search-headless-${{ matrix.target }}
          path: search-headless-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: search-headless-*
          path: dist
          merge-multiple: true
      - name: Publish the tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "search-headless") | .version')
          test "$TAG" = "v$VERSION"
          grep -Fx "CLI_VERSION=\"$TAG\"" install.sh
          cp install.sh dist/install.sh
          (cd dist && sha256sum search-headless-*.tar.gz > SHA256SUMS)
          gh release create "$TAG" dist/* --verify-tag --generate-notes
